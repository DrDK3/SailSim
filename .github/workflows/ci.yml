# Every push and pull request: lint, typecheck, build (with the no-secrets check), unit tests, ingest tests,
# and the browser tests against the production build (at the root and under a GitHub Pages sub-path).
# The hosted runners have no GPU: the 3D scene is drawn in software, so the browser tests are split over three
# parallel jobs with one browser each (two browsers on one runner starve each other: docs/DEPLOYMENT.md).
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Build (typecheck, Vite, secret check)
        run: npm run build
        env:
          # Names the build in saved replays (not a secret).
          VITE_BUILD_ID: ${{ github.sha }}
      - run: npm test
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/ingest/requirements.txt
      - run: pip install -r tools/ingest/requirements.txt
      - name: Ingest tests
        run: python -I -m unittest discover -s tools/ingest -p 'test_*.py'
  browser:
    runs-on: ubuntu-24.04
    # Software WebGL on the runners is slow and the scene keeps growing (marinas, railway): four shards, with room.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser tests (shard ${{ matrix.shard }} of 4)
        run: npx playwright test --shard=${{ matrix.shard }}/4
        env:
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
