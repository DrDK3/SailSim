# Every push and pull request: lint, typecheck, build (with the no-secrets check), unit tests, ingest tests,
# and the browser tests against the production build (at the root and under a GitHub Pages sub-path).
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Build (typecheck, Vite, secret check)
        run: npm run build
        env:
          # Names the build in saved replays (not a secret).
          VITE_BUILD_ID: ${{ github.sha }}
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/ingest/requirements.txt
      - run: pip install -r tools/ingest/requirements.txt
      - name: Ingest tests
        run: python -I -m unittest discover -s tools/ingest -p 'test_*.py'
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
        env:
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
